appId: org.trustroots.nostroots
name: Answer the backup challenge
# Requires: output.words (the 12-word mnemonic) and PREFIX (testID prefix).
---
- runFlow:
    when:
      visible: "Word 1"
    commands:
      - tapOn:
          id: "${PREFIX}-word-1"
      - inputText: ${output.words[0]}
      - hideKeyboard
- runFlow:
    when:
      visible: "Word 2"
    commands:
      - tapOn:
          id: "${PREFIX}-word-2"
      - inputText: ${output.words[1]}
      - hideKeyboard
