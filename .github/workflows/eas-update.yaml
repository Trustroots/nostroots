name: Send an OTA update

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build and send OTA update from
        required: true
        default: main

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: ./.github/actions/repo-setup
        with:
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🗞️ Send Update
        working-directory: ./nr-app
        run: eas update --channel preview --non-interactive --auto
