appId: org.trustroots.nostroots
name: Onboarding - verify a Trustroots email via nr-bridge
env:
  # Served by .maestro/mock-stack. Test-only values.
  TEST_USERNAME: "e2etester"
  TEST_CODE: "123456"
---
# clearState alone is not enough: expo-secure-store keeps the private key in the
# iOS keychain, which survives an app data wipe.
- clearKeychain
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "welcome-get-started"
    timeout: 30000
- tapOn:
    id: "welcome-get-started"

- extendedWaitUntil:
    visible:
      id: "onboarding-identity-continue"
    timeout: 15000
- tapOn:
    id: "onboarding-identity-continue"

- extendedWaitUntil:
    visible:
      id: "onboarding-trustroots-username-input"
    timeout: 15000
- tapOn:
    id: "onboarding-trustroots-username-input"
- inputText: ${TEST_USERNAME}
# hideKeyboard does not work against these inputs; tap the inert heading instead.
- tapOn:
    id: "onboarding-trustroots-heading"

- tapOn:
    id: "onboarding-trustroots-request-code"

# The mock bridge accepts any username and always issues a code.
- extendedWaitUntil:
    visible:
      id: "onboarding-trustroots-code-input"
    timeout: 15000
- tapOn:
    id: "onboarding-trustroots-code-input"
- inputText: ${TEST_CODE}
- tapOn:
    id: "onboarding-trustroots-heading"

- tapOn:
    id: "onboarding-trustroots-verify-code"

# Authenticating generates a key, then publishes the kind 10390 profile to the
# mock relay. Reaching backup-confirm proves both worked.
- extendedWaitUntil:
    visible:
      id: "onboarding-backup-copy-secret"
    timeout: 30000

# The keyboard from the code input survives the navigation and covers the lower
# half of this screen, so dismiss it before touching anything down there.
- tapOn:
    id: "onboarding-backup-heading"

# The generated mnemonic is not known to this flow, so read it off the screen.
# Deliberately not the app's own Copy secret button: its Clipboard write is
# async, and pasting immediately after tapping it pastes nothing.
- copyTextFrom:
    id: "onboarding-backup-secret"
- tapOn:
    id: "onboarding-backup-input"
- pasteText
# Focusing the input scrolls the heading off screen, so dismiss the keyboard by
# tapping the secret instead — it stays in view just above the input.
- tapOn:
    id: "onboarding-backup-secret"

- tapOn:
    id: "onboarding-backup-confirm"
- extendedWaitUntil:
    visible:
      id: "onboarding-backup-finish"
    timeout: 15000
- tapOn:
    id: "onboarding-backup-finish"

- extendedWaitUntil:
    visible:
      id: "map-screen"
    timeout: 30000
