name: nr-app Maestro E2E

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "nr-app/**"

concurrency:
  group: nr-app-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-maestro:
    if: >
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      (github.event.action == 'labeled' && github.event.label.name == 'app-screenshots')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973" \
            "ndk;27.1.12297006"

      - name: Install dependencies
        run: pnpm install

      - name: Free Android E2E disk space
        run: |
          df -h
          docker system prune -af || true
          docker builder prune -af || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Restore Android native build cache
        uses: actions/cache@v4
        with:
          path: |
            nr-app/android
            nr-app/android/.gradle
            nr-app/android/build
            nr-app/android/app/build
          key: ${{ runner.os }}-android-native-${{ hashFiles('pnpm-lock.yaml', 'nr-app/package.json', 'nr-app/app.config.js', 'nr-app/app.json', 'nr-app/metro.config.js', 'nr-app/babel.config.js', 'nr-app/scripts/android-e2e-build.sh') }}
          restore-keys: |
            ${{ runner.os }}-android-native-

      - name: Build Android E2E APK locally
        working-directory: nr-app
        env:
          E2E_REUSE_PREBUILD: "1"
        run: pnpm run build:android-e2e-local

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start deterministic E2E network
        run: docker compose -f nr-app/e2e/docker-compose.yml -f nr-app/e2e/docker-compose.ci.yml up -d --build --wait

      - name: Wait for E2E network
        run: |
          curl --retry 30 --retry-delay 2 --retry-all-errors -fsS http://127.0.0.1:7777 >/dev/null
          curl --retry 30 --retry-delay 2 --retry-all-errors -fsS http://127.0.0.1:8025 >/dev/null
          curl --retry 30 --retry-delay 2 --retry-all-errors -sS http://127.0.0.1:8000 >/dev/null

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_PREWARM_ENABLED: "0"
          E2E_PREWARM_REQUIRED: "0"
          MAESTRO_JUNIT_OUTPUT: .e2e-results/android.xml
          RUN_FULL_E2E: ${{ contains(github.event.pull_request.labels.*.name, 'app-screenshots') }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-linux-hw-accel: false
          pre-emulator-launch-script: |
            adb kill-server || true
            adb start-server
          script: |
            adb devices -l
            adb install -r nr-app/builds/app-e2e-debug.apk
            sh nr-app/scripts/android-e2e-maestro-ci.sh

      - name: Collect Android screenshots
        if: success() && contains(github.event.pull_request.labels.*.name, 'app-screenshots')
        run: |
          mkdir -p nr-app/.e2e-screenshots
          find "$HOME/.maestro/tests" \
            -type f \
            -path "*/takeScreenshot/.e2e-screenshots/*.png" \
            -exec cp {} nr-app/.e2e-screenshots/ \;

      - name: Upload Android screenshots
        if: success() && contains(github.event.pull_request.labels.*.name, 'app-screenshots')
        uses: actions/upload-artifact@v4
        with:
          name: nr-app-screenshots-android
          path: nr-app/.e2e-screenshots/*.png
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Upload Android E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nr-app-e2e-results-android
          path: nr-app/.e2e-results/android.xml
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: Collect Android Maestro artifacts
        if: always()
        run: |
          mkdir -p nr-app/.e2e-artifacts/android/maestro-tests nr-app/.e2e-artifacts/android/logs nr-app/.e2e-artifacts/android/builds
          if [ -d "$HOME/.maestro/tests" ]; then
            rsync -a \
              --include="*.json" \
              --include="*.log" \
              --include="*.yaml" \
              --include="*/" \
              --exclude="*" \
              "$HOME/.maestro/tests/" \
              nr-app/.e2e-artifacts/android/maestro-tests/
          fi
          if [ -f nr-app/builds/app-e2e-debug.apk ]; then
            cp nr-app/builds/app-e2e-debug.apk nr-app/.e2e-artifacts/android/builds/
          fi
          if [ -d nr-app/.e2e-logs/android ]; then
            rsync -a nr-app/.e2e-logs/android/ nr-app/.e2e-artifacts/android/logs/
          fi
          sh nr-app/scripts/sanitize-maestro-artifacts.sh nr-app/.e2e-artifacts/android

      - name: Upload Maestro artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-maestro-artifacts
          path: |
            nr-app/.e2e-artifacts/android/maestro-tests
            nr-app/.e2e-artifacts/android/logs
            nr-app/.e2e-artifacts/android/builds
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Dump E2E network logs
        if: failure()
        run: docker compose -f nr-app/e2e/docker-compose.yml -f nr-app/e2e/docker-compose.ci.yml logs --no-color

      - name: Stop E2E network
        if: always()
        run: docker compose -f nr-app/e2e/docker-compose.yml -f nr-app/e2e/docker-compose.ci.yml down -v

  ios-maestro:
    name: iOS Maestro E2E (experimental)
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ios-e2e') ||
      contains(github.event.pull_request.labels.*.name, 'app-screenshots')
    runs-on: macos-26
    timeout-minutes: 120
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/trustroots-dev
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      SMTP_FROM: noreply@nostroots.local
      DENO_KV_PATH: ":memory:"
      DEEP_LINK_BASE: "nostroots://verify"
      E2E_VERIFICATION_CODE: "123456"
      E2E_VERIFICATION_TOKEN: "00000000-0000-4000-8000-000000000001"
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Install macOS E2E dependencies
        run: |
          brew tap mongodb/brew
          brew trust mongodb/brew
          brew install mongodb-community@7.0 mongosh mailpit
          echo "$(brew --prefix mongodb-community@7.0)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix mongosh)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Restore iOS native build cache
        uses: actions/cache@v4
        with:
          path: |
            nr-app/ios
            nr-app/.e2e-logs/ios/build/DerivedData
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-ios-native-${{ hashFiles('pnpm-lock.yaml', 'nr-app/package.json', 'nr-app/app.config.js', 'nr-app/app.json', 'nr-app/eas.json', 'nr-app/scripts/ios-e2e-build.sh') }}
          restore-keys: |
            ${{ runner.os }}-ios-native-

      - name: Build and install iOS E2E app locally
        working-directory: nr-app
        env:
          E2E_REUSE_PREBUILD: "1"
        run: pnpm run build:ios-e2e-local

      - name: Start deterministic E2E network
        run: |
          mkdir -p nr-app/.e2e-logs/ios "$RUNNER_TEMP/mongodb"

          mongod \
            --dbpath "$RUNNER_TEMP/mongodb" \
            --bind_ip 127.0.0.1 \
            --port 27017 \
            --logpath "$PWD/nr-app/.e2e-logs/ios/mongodb.log" \
            --fork

          for attempt in {1..30}; do
            if mongosh --host 127.0.0.1 --port 27017 --eval 'db.adminCommand("ping")' --quiet >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "MongoDB did not become ready" >&2
              exit 1
            fi
            sleep 2
          done

          MONGO_INITDB_DATABASE=trustroots-dev bash ./.devcontainer/nr-bridge/init-mongo.sh

          mailpit \
            --listen 127.0.0.1:8025 \
            --smtp 127.0.0.1:1025 \
            >nr-app/.e2e-logs/ios/mailpit.log 2>&1 &
          echo "$!" >nr-app/.e2e-logs/ios/mailpit.pid

          DENO_DIR="$RUNNER_TEMP/deno-cache" deno run --no-lock --allow-net --allow-env development-utils/local-relay/tiny-relay.ts \
            >nr-app/.e2e-logs/ios/tiny-relay.log 2>&1 &
          echo "$!" >nr-app/.e2e-logs/ios/tiny-relay.pid

          (
            cd nr-bridge
            deno task run
          ) >nr-app/.e2e-logs/ios/nr-bridge.log 2>&1 &
          echo "$!" >nr-app/.e2e-logs/ios/nr-bridge.pid

      - name: Wait for E2E network
        run: |
          curl --retry 30 --retry-delay 2 --retry-all-errors -fsS http://127.0.0.1:7777 >/dev/null
          curl --retry 30 --retry-delay 2 --retry-all-errors -fsS http://127.0.0.1:8025 >/dev/null
          curl --retry 30 --retry-delay 2 --retry-all-errors -sS http://127.0.0.1:8000 >/dev/null

      - name: Run iPhone Maestro flows
        working-directory: nr-app
        env:
          APP_READY_TIMEOUT_MS: "60000"
          E2E_PREWARM_ENABLED: "1"
          E2E_PREWARM_REQUIRED: "1"
          E2E_PREWARM_SCREEN_ID: screen-welcome
          MAESTRO_JUNIT_OUTPUT: .e2e-results/ios.xml
        run: |
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'app-screenshots') }}" = "true" ]; then
            pnpm run test:maestro:ios:local -- \
              .maestro/smoke.yaml \
              .maestro/welcome-onboarding.yaml \
              .maestro/trustroots-code.yaml \
              .maestro/deep-link-verify.yaml \
              .maestro/main-map-smoke.yaml
          else
            pnpm run test:maestro:ios:local -- .maestro/main-map-smoke.yaml
          fi

      - name: Collect iOS screenshots
        if: success() && contains(github.event.pull_request.labels.*.name, 'app-screenshots')
        run: |
          mkdir -p nr-app/.e2e-screenshots
          find "$HOME/.maestro/tests" \
            -type f \
            -path "*/takeScreenshot/.e2e-screenshots/*.png" \
            -exec cp {} nr-app/.e2e-screenshots/ \;

      - name: Upload iOS screenshots
        if: success() && contains(github.event.pull_request.labels.*.name, 'app-screenshots')
        uses: actions/upload-artifact@v4
        with:
          name: nr-app-screenshots-ios
          path: nr-app/.e2e-screenshots/*.png
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

      - name: Upload iOS E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nr-app-e2e-results-ios
          path: nr-app/.e2e-results/ios.xml
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: Collect iOS Maestro artifacts
        if: always()
        run: |
          mkdir -p nr-app/.e2e-artifacts/ios/maestro-tests nr-app/.e2e-artifacts/ios/logs
          if [ -d "$HOME/.maestro/tests" ]; then
            rsync -a \
              --include="*.json" \
              --include="*.log" \
              --include="*.yaml" \
              --include="*/" \
              --exclude="*" \
              "$HOME/.maestro/tests/" \
              nr-app/.e2e-artifacts/ios/maestro-tests/
          fi
          if [ -d nr-app/.e2e-logs/ios ]; then
            find nr-app/.e2e-logs/ios -maxdepth 1 -type f \( -name "*.log" -o -name "*.json" \) \
              -exec cp {} nr-app/.e2e-artifacts/ios/logs/ \;
          fi
          sh nr-app/scripts/sanitize-maestro-artifacts.sh nr-app/.e2e-artifacts/ios

      - name: Upload iOS Maestro artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-maestro-artifacts
          path: |
            nr-app/.e2e-artifacts/ios/maestro-tests
            nr-app/.e2e-artifacts/ios/logs
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Dump iOS E2E network logs
        if: failure()
        run: |
          for log_file in nr-app/.e2e-logs/ios/*.log; do
            if [ -f "$log_file" ]; then
              echo "===== ${log_file} ====="
              tail -n 200 "$log_file"
            fi
          done

      - name: Stop iOS E2E network
        if: always()
        run: |
          for pid_file in nr-app/.e2e-logs/ios/*.pid; do
            if [ -f "$pid_file" ]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done
          mongod --dbpath "$RUNNER_TEMP/mongodb" --shutdown >/dev/null 2>&1 || true

  publish-screenshots:
    name: Publish PR screenshots
    if: >
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'app-screenshots') &&
      needs.android-maestro.result == 'success' &&
      needs.ios-maestro.result == 'success'
    needs: [android-maestro, ios-maestro]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download screenshots
        uses: actions/download-artifact@v5
        with:
          pattern: nr-app-screenshots-*
          path: tmp/nr-app-screenshots

      - name: Publish screenshots branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          android="$GITHUB_WORKSPACE/tmp/nr-app-screenshots/nr-app-screenshots-android"
          ios="$GITHUB_WORKSPACE/tmp/nr-app-screenshots/nr-app-screenshots-ios"
          test -s "$android/welcome.png"
          test -s "$ios/welcome.png"

          publish_dir="$(mktemp -d)"
          cd "$publish_dir"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git fetch --depth=1 origin pr-screenshots:pr-screenshots 2>/dev/null; then
            git checkout pr-screenshots
          else
            git checkout --orphan pr-screenshots
          fi

          pr_dir="pr-${PR_NUMBER}"
          run_dir="${pr_dir}/${RUN_ID}"
          rm -rf "$pr_dir"
          mkdir -p "$run_dir/android" "$run_dir/ios"
          cp "$android"/*.png "$run_dir/android/"
          cp "$ios"/*.png "$run_dir/ios/"
          git add -A "$pr_dir"
          git commit -m "PR #${PR_NUMBER} nr-app screenshots (${RUN_ID})"
          git push origin HEAD:pr-screenshots

      - name: Update PR screenshot overview
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- nr-app-screenshots -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const runId = context.runId;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${runId}`;
            const base = `https://raw.githubusercontent.com/${owner}/${repo}/pr-screenshots/pr-${issue_number}/${runId}`;
            const screens = [
              ['Welcome', 'welcome.png'],
              ['Trustroots onboarding', 'trustroots.png'],
              ['Verification code', 'trustroots-code.png'],
              ['Backup confirmation', 'backup-confirm.png'],
              ['Map', 'map.png'],
              ['Discover list', 'list.png'],
              ['Settings', 'settings.png'],
            ];
            const rows = screens.map(([label, file]) =>
              `<tr><td>${label}</td><td><img src="${base}/android/${file}" width="280"></td><td><img src="${base}/ios/${file}" width="280"></td></tr>`
            );
            const body = [
              marker,
              '## nr-app screenshot tests',
              '',
              `Captured from the Maestro E2E flows in [workflow run ${runId}](${runUrl}).`,
              '',
              '<details open>',
              `<summary>${screens.length} verified screens on Android and iOS</summary>`,
              '',
              '<table>',
              '<thead><tr><th>Screen</th><th>Android</th><th>iOS</th></tr></thead>',
              '<tbody>',
              ...rows,
              '</tbody>',
              '</table>',
              '</details>',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  update-pr-overview:
    name: Update PR test overview
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [android-maestro, ios-maestro]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download E2E results
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          pattern: nr-app-e2e-results-*
          path: tmp/nr-app-e2e-results
          merge-multiple: true

      - name: Update Maestro rows
        uses: actions/github-script@v8
        env:
          ANDROID_RESULT: ${{ needs.android-maestro.result }}
          IOS_RESULT: ${{ needs.ios-maestro.result }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- nr-app-test-overview -->';
            const start = '<!-- nr-app-e2e-start -->';
            const end = '<!-- nr-app-e2e-end -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body?.includes(marker)
            );

            const android = process.env.ANDROID_RESULT;
            const ios = process.env.IOS_RESULT;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const decodeXml = value => value
              .replaceAll('&quot;', '"')
              .replaceAll('&apos;', "'")
              .replaceAll('&lt;', '<')
              .replaceAll('&gt;', '>')
              .replaceAll('&amp;', '&');
            const parseReport = path => {
              const tests = new Map();
              if (!fs.existsSync(path)) return tests;

              const xml = fs.readFileSync(path, 'utf8');
              const cases = xml.matchAll(
                /<testcase\b([^>]*?)(?:\/>|>([\s\S]*?)<\/testcase>)/g,
              );
              for (const match of cases) {
                const name = match[1].match(/\bname="([^"]*)"/)?.[1];
                if (!name) continue;
                const body = match[2] ?? '';
                tests.set(
                  decodeXml(name),
                  /<(failure|error)\b/.test(body)
                    ? 'failure'
                    : /<skipped\b/.test(body)
                      ? 'skipped'
                      : 'success',
                );
              }
              return tests;
            };
            const androidTests = parseReport('tmp/nr-app-e2e-results/android.xml');
            const iosTests = parseReport('tmp/nr-app-e2e-results/ios.xml');
            const areas = [
              {
                area: 'Startup',
                scenarios: ['Startup: welcome screen'],
              },
              {
                area: 'Onboarding',
                scenarios: [
                  'Onboarding: Trustroots choice',
                  'Onboarding: verification code',
                ],
              },
              {
                area: 'Verification',
                scenarios: ['Verification: deep link'],
              },
              {
                area: 'Main app',
                scenarios: ['Main app: map, discovery, and settings'],
              },
            ];
            const areaStatus = (tests, jobResult, scenarios) => {
              if (tests.size === 0) {
                return ({
                  failure: '✗ JOB FAILED',
                  cancelled: 'CANCELLED',
                  skipped: 'OPTIONAL',
                })[jobResult] ?? 'NOT REACHED';
              }

              const results = scenarios.map(name => tests.get(name) ?? 'not-run');
              const passed = results.filter(result => result === 'success').length;
              const failed = results.filter(result => result === 'failure').length;
              const skipped = results.filter(result => result === 'skipped').length;
              const notRun = results.filter(result => result === 'not-run').length;
              if (failed > 0) return `✗ ${passed}/${scenarios.length} (${failed} failed)`;
              if (passed === scenarios.length) return `✓ ${passed}/${scenarios.length}`;
              if (skipped > 0) return `SKIPPED (${skipped}/${scenarios.length})`;
              if (notRun > 0) return `— ${passed}/${scenarios.length} (${notRun} not run)`;
              return `${passed}/${scenarios.length}`;
            };
            const areaRows = areas.map(({ area, scenarios }) =>
              `<tr><td>${area}</td><td>${scenarios.join('<br>')}</td><td>${areaStatus(androidTests, android, scenarios)}</td><td>${areaStatus(iosTests, ios, scenarios)}</td></tr>`,
            );
            const e2eSection = [
              start,
              '## End-to-end test areas',
              '',
              `Maestro results from [workflow run ${context.runId}](${runUrl}). Full Android and iOS coverage runs with the <code>app-screenshots</code> label.`,
              '',
              '<table>',
              '<thead><tr><th>Area</th><th>Scenarios</th><th>Android</th><th>iOS (experimental)</th></tr></thead>',
              '<tbody>',
              ...areaRows,
              '</tbody>',
              '</table>',
              end,
            ].join('\n');
            let body;
            if (existing) {
              body = existing.body.replace(
                new RegExp(`${start}[\\s\\S]*?${end}`),
                e2eSection,
              );
            } else {
              body = [
                marker,
                '## nr-app test overview',
                '',
                `Status: **${android === 'failure' ? 'Needs attention' : 'Android E2E complete; coverage pending'}**`,
                '',
                '<table>',
                '<thead><tr><th>Suite</th><th>Status</th><th>Recorded</th><th>Result</th><th>Report</th></tr></thead>',
                '<tbody>',
                '<tr><td>Jest + RNTL</td><td>PENDING</td><td>Separate workflow</td><td>Coverage is still running</td><td>Will appear here</td></tr>',
                '</tbody>',
                '</table>',
                '',
                e2eSection,
              ].join('\n');
            }
            if (android === 'failure') {
              body = body.replace(/Status: \*\*[^*]+\*\*/, 'Status: **Needs attention**');
            } else if (body.includes('<tr><td>Jest + RNTL</td><td>✓</td>')) {
              body = body.replace(/Status: \*\*[^*]+\*\*/, 'Status: **Passing**');
            }
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
