packages:
  - 'nr-app'
  - 'nr-common'

peerDependencyRules:
  ignoreMissing:
    - '@babel/*'
    - 'expo-modules-*'
    - 'typescript'

overrides:
  # Keep existing direct workspace constraints centralized here for pnpm 10.
  expo-crypto: 56.0.3
  redux: ^5.0.1

  # Temporary floors for transitive nr-app tooling. The range-qualified keys
  # stop affecting the graph once upstream Expo/Jest packages adopt these
  # versions, so each entry can then be removed without pinning future updates.
  '@tootallnate/once@<2.0.1': 2.0.1
  '@xmldom/xmldom@<0.8.15': 0.8.15
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'baseline-browser-mapping@<2.11.0': 2.11.0
  'browserslist@>=4.0.0 <4.28.7': 4.28.7
  'compression@<1.8.2': 1.8.2
  'decode-uri-component@<0.5.0': 0.5.0
  'image-size@<2.0.3': 2.0.4
  'nanoid@>=3.0.0 <3.3.18': 3.3.18
  'nanoid@>=5.0.0 <5.1.16': 5.1.16
  'postcss-selector-parser@<7.1.6': 7.1.6
  'source-map-js@<1.2.2': 1.2.2
  'zod@>=4.0.0 <4.6.6': 4.6.6
  'flatted@<3.4.2': 3.4.2
  'form-data@>=4.0.0 <4.0.6': 4.0.6
  'glob@>=10.2.0 <10.5.0': 10.5.0
  'immutable@>=4.0.0 <4.3.9': 4.3.9
  'js-yaml@<4.0.0': 3.15.2
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'lodash@>=4.0.0 <4.18.0': 4.18.0
  'minimatch@<3.1.4': 3.1.4
  'minimatch@>=8.0.0 <8.0.6': 8.0.6
  'minimatch@>=9.0.0 <9.0.7': 9.0.7
  'postcss@<8.5.23': 8.5.23
  'shell-quote@<1.11.0': 1.11.0
  'tmp@<0.2.7': 0.2.7

  # xcode 3 declares uuid ^7 even though it only consumes the stable v4 API.
  # Keep this parent-scoped until Expo no longer resolves xcode 3.
  'xcode>uuid': 11.1.1
  'ws@>=7.0.0 <7.5.11': 7.5.11
  'ws@>=8.0.0 <8.21.0': 8.21.0
  'yaml@>=2.0.0 <2.8.3': 2.8.3

# Preserve the callable CommonJS export expected by query-string 7 and Jest.
# The patched 0.5.0 decoder algorithm is unchanged.
patchedDependencies:
  decode-uri-component@0.5.0: pnpm-patches/decode-uri-component@0.5.0.patch
